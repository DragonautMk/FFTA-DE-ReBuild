[package]
name = "installer"
version = "3.0.0"
edition = "2021"

[features]
installer-preview = ["eframe/__screenshot"]

[dependencies]
eframe = "0.37.0"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "7.0.0"

[target.'cfg(windows)'.dependencies]
rfd = "0.18.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

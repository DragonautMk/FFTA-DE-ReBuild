name: Feature request
description: Suggest an improvement or new feature.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would it be useful?
      description: Explain the problem it would solve or how it would help.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any examples, links or screenshots that help explain the idea.

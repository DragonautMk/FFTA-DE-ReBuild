name: FFTA portable Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.100.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Tests
        run: cargo test --locked --release -p installer -p input-config -p recomp --lib --bins -- --test-threads=1
      - name: Package
        run: bash scripts/linux/package_ffta_linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FFTARecomp-linux-portable
          path: dist/FFTARecomp-linux-portable.tar.gz
          if-no-files-found: error

